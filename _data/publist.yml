- title: "Adult neural function requires MeCP2"
  image: pub_AKO_2012.png
  description: We used conditional Cre/LoxP to knock-out the neurodevelopmental gene, MeCP2, in adult animals, and demonstrated that AKO animals develop all of the symptoms of germline KO animals, suggesting that mature nervous system function depends on Mecp2 function.
  authors: <strong>McGraw CM</strong>, Samaco RC, and Zoghbi HY"
  link:
